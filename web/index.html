  <script>
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new Event('pwa-install-available'));
    });
    window.addEventListener('appinstalled', function () {
      window.deferredPrompt = null;
      window.dispatchEvent(new Event('pwa-installed'));
    });
    window.solicitarInstalacionPwa = function () {
      return new Promise(function (resolve) {
        var prompt = window.deferredPrompt;
        if (!prompt) {
          resolve(false);
          return;
        }
        prompt.prompt();
        prompt.userChoice
          .then(function (choice) {
            window.deferredPrompt = null;
            resolve(choice.outcome === 'accepted');
          })
          .catch(function () {
            window.deferredPrompt = null;
            resolve(false);
          });
      });
    };

    window.fernecitoForzarRecargaPwa = async function () {
      try {
        if ('serviceWorker' in navigator) {
          var registration = await navigator.serviceWorker.getRegistration();
          if (registration) {
            try {
              await registration.update();
            } catch (e) {}
            if (registration.waiting) {
              registration.waiting.postMessage('skipWaiting');
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              await new Promise(function (resolve) {
                var done = false;
                var finish = function () {
                  if (done) return;
                  done = true;
                  resolve();
                };
                navigator.serviceWorker.addEventListener('controllerchange', finish, { once: true });
                setTimeout(finish, 700);
              });
            }
          }
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (key) { return caches.delete(key); }));
        }
      } catch (e) {}
      window.location.reload();
    };

    (function () {
      function preferenciaOscuraLocales() {
        try {
          if (localStorage.getItem('flutter.modo_oscuro_locales') === 'true') {
            return true;
          }
          if (localStorage.getItem('flutter.modo_oscuro_locales') === 'false') {
            return false;
          }
        } catch (e) {}
        return window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      window.fernecitoActualizarThemeColor = function (oscuro) {
        var color = oscuro ? '#000000' : '#FFFFFF';
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', color);
        var apple = document.getElementById('apple-status-bar-style');
        if (apple) {
          apple.setAttribute('content', oscuro ? 'black' : 'default');
        }
        document.documentElement.style.backgroundColor = color;
        if (document.body) document.body.style.backgroundColor = color;
      };

      window.fernecitoActualizarThemeColor(preferenciaOscuraLocales());
    })();
  </script>

    .cover {

    }

    .bottom {

      -ms-transform: translate(-50%, 0);

    }

    .bottomRight {

      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      if (window.fernecitoActualizarThemeColor) {
        window.fernecitoActualizarThemeColor(
          localStorage.getItem('flutter.modo_oscuro_locales') === 'true'
        );
      } else {
        document.body.style.background = "transparent";
      }
    }
  </script>
